<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>T-RX Runner · Multiplayer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦖</text></svg>">
<link rel="stylesheet" href="game.css">
<style>
  #mp-hud {
    position: fixed; top: 8px; left: 8px; right: 8px; z-index: 9999;
    font-family: 'Open Sans', 'Courier New', monospace;
    background: rgba(255,255,255,.85); border: 2px solid #535353; border-radius: 8px;
    padding: 6px 10px; max-width: 420px;
  }
  #mp-room { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #mp-room input { font: inherit; padding: 2px 6px; width: 90px; border: 1px solid #535353; border-radius: 4px; }
  #mp-room button { font: inherit; padding: 2px 10px; border: 1px solid #535353; border-radius: 4px; background: #f7f7f7; cursor: pointer; }
  #mp-room button:hover { background: #e8e8e8; }
  #mp-players { margin-top: 6px; }
  .mp-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 13px; }
  .mp-row.dead { opacity: .45; text-decoration: line-through; }
  .mp-tag { min-width: 64px; font-weight: bold; }
  .mp-bar-wrap { flex: 1; height: 10px; background: #eee; border: 1px solid #bbb; border-radius: 5px; overflow: hidden; position: relative; }
  .mp-bar { height: 100%; width: 0%; background: #4a90d9; transition: width .4s linear; }
  .mp-row.dead .mp-bar { background: #999; }
  .mp-score { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .mp-me .mp-tag::after { content: " (you)"; font-weight: normal; font-size: 11px; }
  #mp-status { font-size: 11px; color: #666; margin-top: 4px; }
  #mp-ws { width: 200px !important; font-size: 11px; }
</style>
</head>
<body id="t" class="offline">
  <div id="mp-hud">
    <div id="mp-room">
      Room <input id="mp-room-input" placeholder="CODE" maxlength="8">
      <button id="mp-create">Create</button>
      <button id="mp-join">Join</button>
      <button id="mp-leave">Leave</button>
      <span id="mp-count"></span>
    </div>
    <div id="mp-invite" style="display:none; margin-top:4px; font-size:11px; word-break:break-all">
      Invite link: <a id="mp-invite-link" href="#"></a> <button id="mp-copy">Copy</button>
    </div>
    <div id="mp-players"></div>
    <div id="mp-status">Not connected</div>
    <div style="margin-top:4px"><input id="mp-ws" placeholder="wss://your-ws-server"></div>
  </div>

  <div id="messageBox" class="sendmessage">
    <h1 style="text-align: center;font-family: 'Open Sans', sans-serif;">Press Space to start</h1>
  </div>
  <div id="main-frame-error" class="interstitial-wrapper">
    <div id="main-content">
      <div class="icon icon-offline" alt=""></div>
    </div>
    <div id="offline-resources">
      <img id="offline-resources-1x" src="assets/default_100_percent/100-offline-sprite.png">
      <img id="offline-resources-2x" src="assets/default_200_percent/200-offline-sprite.png">
    </div>
  </div>

  <script src="game.js"></script>
  <script src="net.js"></script>
</body>
</html>
